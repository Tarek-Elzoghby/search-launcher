<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple search launcher for GitHub, DEV.to, and Stack Overflow." />
    <title>Search Launcher</title>
    <style>
      :root {
        color-scheme: light dark;

        --background: #fafaf9; /* page background */
        --text: #1c1917; /* main text */
        --muted: #57534e; /* hint line, input border */
        --accent: #2563eb; /* buttons, focus ring */
        --on-accent: #ffffff; /* text on top of buttons */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1c1917; /* page background */
          --text: #fafaf9; /* main text */
          --muted: #a8a29e; /* hint line, input border */
          --accent: #60a5fa; /* buttons, focus ring */
          --on-accent: #1c1917; /* text on top of buttons */
        }
      }
      body {
        background: var(--background);
        color: var(--text);
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1rem 2rem;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.5rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem;
        font: inherit;
        border: 1px solid var(--muted);
        background: var(--background);
        color: var(--text);
        border-radius: 0.5rem;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #search-hint {
        margin: 0.5rem 0 1.5rem;
        color: var(--muted);
      }
      .destination-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      button {
        flex: 1 1 auto;
        padding: 0.75rem 1rem;
        font: inherit;
        border: none;
        background: var(--accent);
        color: var(--on-accent);
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.85;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Search Launcher</h1>
      <form method="get" target="_blank">
        <label for="search-input">Search Query:</label>
        <input
          name="q"
          id="search-input"
          type="search"
          placeholder="Enter your search query..."
          aria-describedby="search-hint"
          autofocus
          required
        />
        <p id="search-hint">
          <small
            >For Stack Overflow searches, use quotes in your search query. ex:
            "python list comprehension"</small
          >
        </p>
        <div class="destination-buttons">
          <button
            formaction="https://github.com/search"
            name="type"
            value="repositories"
          >
            GitHub repositories
          </button>
          <button formaction="https://dev.to/search">DEV.to</button>
          <button formaction="https://stackoverflow.com/search">
            Stack Overflow
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
